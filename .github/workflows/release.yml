# Builds AccessEngine for Linux, macOS and Windows, publishes a GitHub Release,
# and submits the binaries to VirusTotal.
#
# Cutting a release:
#   1. Bump `version` in Cargo.toml and commit.
#   2. git tag v0.1.0 && git push origin v0.1.0
#
# Running this manually (workflow_dispatch) builds the matrix but does not
# publish or submit anything — useful for checking the build still works.
#
# Required repository secret:
#   VT_API_KEY — a VirusTotal API key (Settings > Secrets and variables > Actions).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN: accessengine

jobs:
  # Refuse to build if the tag and Cargo.toml disagree about the version, which
  # would otherwise ship artifacts whose filenames lie about their contents.
  check:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ "$tag" != "$manifest" ]]; then
              echo "::error::Tag v$tag does not match Cargo.toml version $manifest"
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$manifest" >> "$GITHUB_OUTPUT"
          fi

      # The release page copies its notes from CHANGELOG.md, so a missing entry
      # is caught here in seconds rather than after the builds have run.
      - name: Check the changelog has an entry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

  build:
    name: Build ${{ matrix.slug }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slug: linux-x86_64
          - os: macos-14
            slug: macos-arm64
          - os: windows-2022
            slug: windows-x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.slug }}

      # egui/winit, rfd (GTK3), rodio (ALSA) and tts (speech-dispatcher) all
      # need development headers that the runner image does not ship.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libasound2-dev \
            libspeechd-dev \
            libgtk-3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libgl1-mesa-dev

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          cargo build --release --locked
          strip "target/release/$BIN"
          mkdir -p dist
          tar -C target/release -czf \
            "dist/$BIN-v${{ needs.check.outputs.version }}-${{ matrix.slug }}.tar.gz" "$BIN"

      # A bare Unix executable has nothing macOS can launch it with, so
      # double-clicking one just opens Terminal. Ship a .app bundle instead.
      # Apple Silicon only: Apple stopped selling Intel Macs in 2023, and
      # Rosetta 2 runs the arm64 build fine on anyone still on Intel.
      - name: Build (macOS, Apple Silicon)
        if: matrix.os == 'macos-14'
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          rustup target add aarch64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin

          app="staging/AccessEngine.app"
          mkdir -p dist "$app/Contents/MacOS" "$app/Contents/Resources"

          cp "target/aarch64-apple-darwin/release/$BIN" "$app/Contents/MacOS/$BIN"
          strip "$app/Contents/MacOS/$BIN"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>AccessEngine</string>
            <key>CFBundleDisplayName</key><string>The Accessibility Engine</string>
            <key>CFBundleExecutable</key><string>$BIN</string>
            <key>CFBundleIdentifier</key><string>com.mediaswing.accessengine</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"

          tar -C staging -czf \
            "dist/$BIN-v$version-${{ matrix.slug }}.tar.gz" "AccessEngine.app"

      - name: Build (Windows)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          mkdir -p dist
          7z a "dist/$BIN-v${{ needs.check.outputs.version }}-${{ matrix.slug }}.zip" \
            "./target/release/$BIN.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.slug }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [check, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # This version's changelog section leads the release page; GitHub's own
      # generated notes are appended after it by --generate-notes.
      - name: Assemble release notes
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          {
            echo "## Changelog"
            echo
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag

  virustotal:
    name: Submit to VirusTotal
    needs: [check, release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # A VirusTotal outage or a spent quota must not fail a release that has
    # already been published.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload samples and link the reports
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # This job does not check the repo out, so gh needs telling where to look.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${VT_API_KEY:-}" ]]; then
            echo "::warning::VT_API_KEY is not set; skipping submission."
            exit 0
          fi

          report=$'\n\n## VirusTotal\n'
          first=1

          for f in dist/*; do
            # The free tier allows roughly four requests a minute and each file
            # costs two, so pace the loop rather than collecting 429s.
            if [[ $first -eq 0 ]]; then sleep 35; fi
            first=0

            name=$(basename "$f")
            sha=$(sha256sum "$f" | cut -d' ' -f1)

            # /files caps out at 32 MB; the upload_url flow has no such limit,
            # so use it uniformly and stop worrying about artifact growth.
            url=$(curl -sS --fail-with-body \
              -H "x-apikey: $VT_API_KEY" \
              https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)

            curl -sS --fail-with-body \
              -H "x-apikey: $VT_API_KEY" \
              -F "file=@$f" "$url" > /dev/null

            echo "Submitted $name ($sha)"
            # The by-hash permalink is stable and fills in once analysis finishes,
            # unlike the one-shot analysis id the upload returns.
            report+="- [\`$name\`](https://www.virustotal.com/gui/file/$sha)"$'\n'
          done

          body=$(gh release view "${{ github.ref_name }}" --json body -q .body)
          gh release edit "${{ github.ref_name }}" --notes "${body}${report}"
