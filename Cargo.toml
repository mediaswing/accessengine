[package]
name = "accessengine"
version = "1.3.0"
edition = "2021"
description = "Cross-platform graphical text-to-speech reader with system voices, ElevenLabs, local vision models, and safety/pronunciation wordlists"
license = "GPL-3.0-or-later"

[dependencies]
# GUI
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["image", "file"] }
rfd = "0.17.2"

# Speech
tts = "0.26.3"
# "mp3" decodes what ElevenLabs returns; "wav" decodes the two UI cues.
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "mp3",
    "wav",
] }

# Networking (ElevenLabs + Ollama)
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }

# Support
anyhow = "1.0.104"
base64 = "0.23.1"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.34"
kamadak-exif = "0.6.1"

[profile.release]
opt-level = 2
