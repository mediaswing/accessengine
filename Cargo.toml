[package]
name = "accessengine"
version = "1.9.0"
edition = "2021"
description = "Cross-platform graphical text-to-speech reader with system voices, five cloud voice services, an audio player, local vision models, and safety/pronunciation wordlists"
license = "GPL-3.0-or-later"

[dependencies]
# GUI
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["image", "file"] }
rfd = "0.17.2"

# Speech
tts = "0.26.3"
# "mp3" decodes what every cloud provider is asked for; "wav" the two UI cues.
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "mp3",
    "wav",
] }

# Networking (the cloud voices + Ollama)
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }

# PowerPoint. A `.pptx` is a zip of XML: `deflate` is the only method Office
# has ever written one with, and the rest of the crate's formats would be dead
# weight. The legacy `.ppt` container is read by `src/powerpoint.rs` itself.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Amazon Polly signs its requests with AWS Signature Version 4, which is a
# chain of HMAC-SHA256 over strings this app builds itself — about eighty lines
# in `speech/polly.rs`. These two crates are the hash and the MAC, and nothing
# else. The alternative is `aws-sdk-polly`, which brings tokio, hyper and some
# fifty crates besides, for one provider out of five in an app whose HTTP is
# otherwise blocking `reqwest`.
sha2 = "0.10.9"
hmac = "0.12.1"

# The language the computer is set to, for `i18n` to pick a language file by.
sys-locale = "0.3.2"

# Support
anyhow = "1.0.104"
base64 = "0.23.1"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4.34"
kamadak-exif = "0.6.1"

[dev-dependencies]
# Only to ask a font file whether it has a glyph for a character, which is how
# the language files are checked for characters the bundled font cannot draw —
# see `i18n`. egui's own `Fonts::has_glyph` cannot answer this: it reports
# false for every character that happens to live in the same face as the
# replacement glyph, which is most of the transport symbols on this app's own
# buttons. Already in the tree via `egui`, so naming it here costs no extra
# build.
ab_glyph = "0.2"

[profile.release]
opt-level = 2
