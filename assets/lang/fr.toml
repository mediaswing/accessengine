# ------------------------------ ce qui est demandé au modèle de vision
#
# Ces quatre consignes ne s'affichent pas : elles sont envoyées au modèle qui
# lit les images et les vidéos. Écrites en français, elles produisent une
# description en français, qu'une voix française peut lire. Gardez la dernière
# phrase de chacune : sans elle le modèle répond en Markdown, et un synthétiseur
# vocal lit les astérisques à voix haute.

prompt.fallback = "Décrivez cette image, y compris tout texte qu'elle contient."

prompt.vision = "Décrivez ce que montre cette image en deux ou trois phrases simples. Transcrivez "
                "ensuite chaque mot du texte qui y figure, exactement tel qu'il est écrit, en "
                "conservant l'ordre de lecture et les retours à la ligne. Si l'image est "
                "essentiellement une page ou un écran de texte, limitez la description à une courte "
                "phrase et donnez la transcription complète. Votre réponse sera lue à voix haute : "
                "écrivez donc des phrases simples, sans titres, puces, markdown, astérisques ni "
                "blocs de code."

prompt.frame = "Ceci est une image isolée extraite d'une vidéo. Décrivez ce qu'elle montre en une ou "
               "deux phrases simples : le lieu, qui ou quoi s'y trouve, et ce qu'ils semblent faire. "
               "Si des mots apparaissent à l'écran, donnez-les exactement tels qu'ils sont écrits. "
               "Ne commencez pas par une formule du type « cette image montre » — décrivez la scène "
               "directement. Votre réponse sera lue à voix haute : écrivez donc des phrases simples, "
               "sans titres, puces, markdown, astérisques ni blocs de code."

prompt.narration = "Voici les descriptions d'images fixes extraites d'une vidéo, dans l'ordre, chacune "
                   "accompagnée du moment où elle apparaît. Rédigez une description continue et fluide "
                   "de la vidéo, destinée à quelqu'un qui ne peut pas la voir. Ne décrivez que ce que "
                   "les images montrent réellement : n'inventez ni événements, ni dialogues, ni "
                   "explications sur ce qui s'est passé entre elles, et lorsque les images ne disent "
                   "pas ce qui relie deux moments, passez simplement au suivant. Ne mentionnez les "
                   "horodatages que lorsqu'ils comptent. Votre réponse sera lue à voix haute : écrivez "
                   "donc des phrases simples, sans titres, puces, markdown, astérisques ni blocs de "
                   "code."
