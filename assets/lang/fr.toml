# accessengine — fichier de langue française
#
# Traduction de départ, écrite en même temps que le système qui la charge. Elle
# a besoin d'être relue par une personne dont le français est la langue
# maternelle : voir la section « Traduire l'application » du README.
#
# Les clés à gauche du signe égal ne se traduisent jamais. {C} devient ⌘ sur un
# Mac et Ctrl+ sous Windows. Les autres mots entre accolades sont remplacés par
# l'application ; on peut les déplacer dans la phrase, jamais les renommer.

