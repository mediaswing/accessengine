# --------------------------------------------------- how long things take

# Spoken durations, read aloud as often as they are seen. Every one of the four
# below is counted, so give each the forms your language uses.
time.seconds.one = "{n} second"
time.seconds.other = "{n} seconds"
time.minutes.one = "{n} minute"
time.minutes.other = "{n} minutes"
# Minutes and seconds together: "3 minutes 20 seconds".
time.both = "{minutes} {seconds}"


# ------------------------------------------------ the vision models offered

model.qwen3b = "Qwen2.5-VL 3B — about 3 GB. Reads text well and is the quickest to download."
model.qwen7b = "Qwen2.5-VL 7B — about 5.7 GB. Better on dense or handwritten pages, slower to answer."
model.granite = "Granite Vision 2B — about 2.3 GB. The smallest; tuned for documents and tables."
model.gemma = "Gemma 3 4B — about 3.2 GB. Describes photographs and scenes well."
model.minicpm = "MiniCPM-V 8B — about 5.2 GB. A strong all-rounder on both text and scenes."


# ------------------------------------------- what the vision model is asked
#
# These three are not interface text: they are sent to the model that reads
# images and video. Write them in the language you want the descriptions read
# back in — a French app with a French prompt gets a French description that a
# French voice can read. Keep the instructions themselves, especially the last
# sentence of each: without it the model answers in Markdown, and a speech
# synthesiser reads the asterisks out.
#
# A prompt the user has edited in Settings is never overwritten by these.

# Sent instead when a model answers the full prompt with silence, which small
# ones do on a long conditional instruction. Keep it as plain as this.
prompt.fallback = "Describe this image, including any text it contains."

prompt.vision = "Describe what this image shows in two or three plain sentences. Then transcribe every "
                "word of any text that appears in it, exactly as written, preserving the reading order "
                "and line breaks. If the image is mainly a page or screen of text, keep the description "
                "to one short sentence and give the full transcription. Your answer will be read aloud, "
                "so write plain sentences with no headings, bullet points, markdown, asterisks or code "
                "blocks."

prompt.frame = "This is a single frame from a video. Describe what it shows in one or two plain sentences: "
               "where it is, who or what is in it, and what they appear to be doing. If words appear on "
               "screen, give them exactly as written. Do not begin with a phrase like \"this image shows\" — "
               "describe the scene directly. Your answer will be read aloud, so write plain sentences with "
               "no headings, bullet points, markdown, asterisks or code blocks."

prompt.narration = "Below are descriptions of still frames taken from a video, in order, each labelled with when "
                   "it appears. Write a single flowing description of the video for someone who cannot see it. "
                   "Describe only what the frames actually show: do not invent events, dialogue or explanations "
                   "for what happened between them, and where the frames do not say what connects two moments, "
                   "simply move on to the next. Mention the timings only where they matter. Your answer will be "
                   "read aloud, so write plain sentences with no headings, bullet points, markdown, asterisks or "
                   "code blocks."
