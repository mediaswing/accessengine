# ----------------------------------------------------------------- tables
#
# A table — in a spreadsheet file, or on a slide — is not read out as lines of
# text. Every value is spoken under the name of its column, because by the
# fourth row nobody is still holding the header line in their head. These are
# the app's own words, inserted into somebody's document and then spoken, so
# they are the one set of messages here that a listener hears rather than reads.

# A presentation is read slide by slide, each announced by its number, so that
# following along by ear keeps the same count as the person at the front of the
# room. A slide with nothing on it says so rather than being skipped.
slide.heading = "Slide {number}."
slide.empty   = "Slide {number}. No text on this slide."

